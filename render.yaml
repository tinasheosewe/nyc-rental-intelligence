# render.yaml — Render Blueprint (Infrastructure as Code)
# Docs: https://docs.render.com/blueprint-spec
#
# Deploys two services:
#   1. apthunt-api    — Python / FastAPI backend
#   2. apthunt-web    — Next.js frontend
#
# Usage:
#   Push this repo to GitHub, then go to https://dashboard.render.com
#   → New → Blueprint → connect the repo → Render reads this file.

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: apthunt-api
    runtime: python
    plan: free
    # Set APTHUNT_DB_URL in the Render dashboard to a valid SQLite seed URL.
    # The backend build now fails if the file is missing, not SQLite, or empty.
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      # Optional overrides set manually in Render:
      #   APTHUNT_DB_URL           -> production seed database URL
      #   APTHUNT_DB_PATH          -> custom on-disk SQLite path
      #   APTHUNT_REQUIRE_LISTINGS -> set to false only for empty/bootstrap envs
      - key: CORS_ORIGINS
        fromService:
          name: apthunt-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ── Frontend (Next.js) ────────────────────────────────────────
  - type: web
    name: apthunt-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Used by next.config.ts rewrites to proxy /api/* to the backend
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: apthunt-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
